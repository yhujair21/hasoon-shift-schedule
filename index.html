<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Hasoon Shift Schedule</title><style>
:root{--bg:#eef4fb;--ink:#1d2a3a;--muted:#718096;--weekend:#ffe5e9}*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow-x:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0%,#dce8ff,transparent 28%),radial-gradient(circle at 90% 10%,#eee1ff,transparent 25%),var(--bg);min-height:100vh}.wrap{width:100%;max-width:1180px;margin:auto;padding:34px 20px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.brand h1{margin:0;font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-2px}.brand p{margin:7px 0;color:var(--muted)}.cycle,.stat,.calendar{background:rgba(255,255,255,.86);border:1px solid #fff;box-shadow:0 18px 45px rgba(43,65,100,.12)}.cycle{border-radius:18px;padding:12px 15px;font-size:13px;color:var(--muted);white-space:nowrap}.hero{background:linear-gradient(135deg,#536df4,#7857df);border-radius:28px;padding:28px;color:#fff;box-shadow:0 18px 45px rgba(43,65,100,.12);position:relative;overflow:hidden;margin-bottom:25px}.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:25px}.today-label{text-transform:uppercase;letter-spacing:2px;font-size:12px;opacity:.78}.hero h2{font-size:34px;line-height:1.1;margin:6px 0}.hero .date{opacity:.86}.hamster{width:115px;height:115px;position:relative;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 10px 8px rgba(0,0,0,.15))}.ear{position:absolute;width:36px;height:36px;background:#d79b70;border-radius:50%;top:2px;z-index:1}.ear:after{content:"";position:absolute;inset:7px;background:#f3c0a2;border-radius:50%}.ear.left{left:12px}.ear.right{right:12px}.head{width:86px;height:78px;background:#dca378;border-radius:47%;position:relative;z-index:2;transform:translateY(7px);box-shadow:inset 0 -7px 0 rgba(170,100,60,.12)}.cheek{position:absolute;width:38px;height:31px;background:#efc19f;border-radius:50%;bottom:7px}.cheek.l{left:-2px}.cheek.r{right:-2px}.eye{position:absolute;width:9px;height:11px;background:#273044;border-radius:50%;top:27px}.eye.l{left:24px}.eye.r{right:24px}.nose{position:absolute;left:39px;top:42px;width:9px;height:7px;background:#9c5c59;border-radius:50%}.mouth{position:absolute;left:36px;top:49px;width:17px;height:9px;border-bottom:2px solid #8d514d;border-radius:0 0 50% 50%}.teeth{position:absolute;left:41px;top:54px;width:8px;height:5px;background:#fff;border-radius:0 0 3px 3px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}.stat{border-radius:18px;padding:17px 18px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.value{font-size:22px;font-weight:800;margin-top:5px}.calendar{border-radius:25px;padding:20px}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}.month-nav{display:flex;align-items:center;gap:9px}.month-nav h3{margin:0;font-size:20px;min-width:210px}.navbtn{border:0;background:#eef2ff;color:#536df4;width:38px;height:38px;border-radius:12px;font-size:22px;font-weight:800;cursor:pointer}.todaybtn{border:0;background:#536df4;color:#fff;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;width:100%}.dow{text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:5px;min-width:0}.day{min-width:0;min-height:112px;background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:11px;position:relative;transition:.2s;overflow:hidden}.day:hover{transform:translateY(-2px)}.day.weekend{background:var(--weekend);border-color:#ff9eaa}.day.current{outline:3px solid #536df4;box-shadow:0 8px 24px rgba(83,109,244,.22);z-index:2}.num{font-size:12px;font-weight:800;color:#64748b}.shift{margin-top:15px;font-weight:800;font-size:14px;line-height:1.15}.shift small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-top:5px}.current .shift{padding-right:28px}.badge{position:absolute;right:8px;top:8px;font-size:9px;padding:3px 6px;border-radius:999px;background:#edf2ff;color:#536df4;font-weight:800}.mini{position:absolute;right:0;bottom:0;transform:scale(.19);transform-origin:bottom right;z-index:3}.evening{color:#b26c00}.morning{color:#3868c5}.night{color:#5644b2}.rest{color:#26836a}.off{color:#667085}.evening-dot{background:#f6b84b}.morning-dot{background:#5b8def}.night-dot{background:#6b5bd6}.rest-dot{background:#58b99a}.off-dot{background:#9aa7b8}footer{text-align:center;color:var(--muted);font-size:12px;line-height:1.4;margin-top:20px}@media(max-width:800px){.wrap{padding:24px 14px 40px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid{gap:5px}.day{min-height:92px;padding:8px;border-radius:13px}.shift{font-size:12px;margin-top:14px}.shift small{font-size:10px}.hero-grid{grid-template-columns:minmax(0,1fr) auto;gap:8px}.hero{padding:22px;margin-bottom:18px;border-radius:24px}.hero h2{font-size:29px}.hero .date{font-size:15px}.today-label{font-size:10px;letter-spacing:1.5px}.hero .hamster{width:88px;height:88px}.hero .ear{width:30px;height:30px}.hero .ear.left{left:8px}.hero .ear.right{right:8px}.hero .head{width:68px;height:62px}.hero .cheek{width:30px;height:25px}.hero .eye{width:7px;height:9px;top:22px}.hero .eye.l{left:19px}.hero .eye.r{right:19px}.hero .nose{left:31px;top:34px;width:8px;height:6px}.hero .mouth{left:29px;top:40px;width:14px;height:8px}.hero .teeth{left:32px;top:45px;width:7px;height:4px}.cards .stat{padding:15px}.value{font-size:20px}.calendar{padding:14px;border-radius:22px}.calendar-head{display:block;margin-bottom:10px}.month-nav{justify-content:space-between;margin-bottom:10px}.month-nav h3{font-size:22px;min-width:0;flex:1;text-align:center}.navbtn{width:34px;height:34px}.todaybtn{font-size:11px;padding:7px 9px}.legend{gap:8px;font-size:11px}.dow{font-size:10px;padding:4px 1px}.num{font-size:11px}.current .shift{padding-right:22px}.mini{transform:scale(.16);right:0;bottom:0}footer{font-size:11px}}@media(max-width:430px){.wrap{padding:18px 10px 32px}.brand h1{font-size:25px;letter-spacing:-1px}.brand p{font-size:10px;margin-top:4px}.cycle{display:none}header{margin-bottom:15px}.hero{padding:19px 18px;border-radius:22px}.hero-grid{grid-template-columns:minmax(0,1fr) 76px}.hero h2{font-size:25px;line-height:1.12;margin:5px 0}.hero .date{font-size:13px}.today-label{font-size:9px;letter-spacing:1.1px;white-space:nowrap}.hero .hamster{width:76px;height:76px}.hero .ear{width:27px;height:27px;top:1px}.hero .ear.left{left:5px}.hero .ear.right{right:5px}.hero .head{width:60px;height:55px;transform:translateY(6px)}.hero .cheek{width:27px;height:22px;bottom:5px}.hero .eye{width:6px;height:8px;top:20px}.hero .eye.l{left:17px}.hero .eye.r{right:17px}.hero .nose{left:27px;top:31px;width:7px;height:5px}.hero .mouth{left:25px;top:36px;width:12px;height:7px}.hero .teeth{left:28px;top:41px;width:6px;height:4px}.cards{gap:8px;margin-bottom:15px}.stat{border-radius:16px;padding:13px 14px}.label{font-size:10px}.value{font-size:17px}.calendar{padding:11px;border-radius:20px}.month-nav h3{font-size:19px}.legend{gap:6px;font-size:10px}.dot{width:8px;height:8px;margin-right:3px}.grid{gap:4px}.day{min-height:88px;padding:7px;border-radius:12px}.dow{font-size:9px}.num{font-size:10px}.shift{font-size:10.5px;margin-top:13px}.shift small{font-size:9px;margin-top:4px}.current .shift{padding-right:20px}.badge{font-size:7px;right:5px;top:5px;padding:3px 5px}.mini{transform:scale(.14);right:-1px;bottom:-1px}footer{margin-top:15px}}</style></head><body><div class="wrap"><header><div class="brand"><h1>HASOON SHIFT SCHEDULE</h1><p>2 Evening → 2 Morning → 2 Night → Rest → Off</p></div><div class="cycle"><strong>8-day cycle</strong><br>Repeats continuously</div></header><section class="hero"><div class="hero-grid"><div><div class="today-label" id="todayLabel"></div><h2 id="heroShift"></h2><div class="date" id="heroTomorrow"></div></div><div class="hamster"><div class="ear left"></div><div class="ear right"></div><div class="head"><div class="cheek l"></div><div class="cheek r"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div></div></section><section class="cards"><div class="stat"><div class="label">Current</div><div class="value" id="currentCard"></div></div><div class="stat"><div class="label">Tomorrow</div><div class="value" id="tomorrowCard"></div></div><div class="stat"><div class="label">Next Rest</div><div class="value" id="nextRest"></div></div><div class="stat"><div class="label">Next Off</div><div class="value" id="nextOff"></div></div></section><section class="calendar"><div class="calendar-head"><div class="month-nav"><button class="navbtn" id="prev">‹</button><h3 id="monthTitle"></h3><button class="navbtn" id="next">›</button><button class="todaybtn" id="todayBtn">Today</button></div><div class="legend"><span><i class="dot evening-dot"></i>Evening</span><span><i class="dot morning-dot"></i>Morning</span><span><i class="dot night-dot"></i>Night</span><span><i class="dot rest-dot"></i>Rest</span><span><i class="dot off-dot"></i>Off</span></div></div><div class="grid" id="calendar"></div></section><footer>Friday & Saturday are highlighted specially • The hamster follows the current day 🐹</footer></div><script>
const cycle=[["Evening","Day 1","evening"],["Evening","Day 2","evening"],["Morning","Day 1","morning"],["Morning","Day 2","morning"],["Night","Day 1","night"],["Night","Day 2","night"],["Rest","Recovery","rest"],["Off","Day off","off"]],reference=new Date(2026,8,20),referenceIndex=3;let view=new Date();view.setDate(1);function day(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function shiftFor(d){let n=Math.round((day(d)-reference)/86400000),i=((referenceIndex+n)%8+8)%8;return cycle[i]}function shortDate(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}function longDate(d){return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}function label(s){return s[0]+(s[1].startsWith('Day')?' '+s[1].replace('Day ',''):'')}function hamster(){return '<div class="hamster mini"><div class="ear left"></div><div class="ear right"></div><div class="head"><div class="cheek l"></div><div class="cheek r"></div><div class="eye l"></div><div class="eye r"></div><div class="nose"></div><div class="mouth"></div><div class="teeth"></div></div></div>'}function render(){let today=day(new Date()),s=shiftFor(today),tom=new Date(today);tom.setDate(tom.getDate()+1);let ts=shiftFor(tom);document.getElementById('todayLabel').textContent='TODAY • '+longDate(today).toUpperCase();document.getElementById('heroShift').textContent=s[0]+' Shift — '+s[1];document.getElementById('heroTomorrow').textContent='Tomorrow: '+ts[0]+' Shift — '+ts[1];document.getElementById('currentCard').textContent=label(s);document.getElementById('tomorrowCard').textContent=label(ts);let r=new Date(today),o=new Date(today);do{r.setDate(r.getDate()+1)}while(shiftFor(r)[2]!=='rest');do{o.setDate(o.getDate()+1)}while(shiftFor(o)[2]!=='off');document.getElementById('nextRest').textContent=shortDate(r);document.getElementById('nextOff').textContent=shortDate(o);renderCalendar(today)}function renderCalendar(today){const cal=document.getElementById('calendar');cal.innerHTML='';document.getElementById('monthTitle').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>{let e=document.createElement('div');e.className='dow';e.textContent=x;cal.appendChild(e)});let first=new Date(view.getFullYear(),view.getMonth(),1),start=first.getDay(),last=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let i=0;i<start;i++)cal.appendChild(document.createElement('div'));for(let d=1;d<=last;d++){let date=new Date(view.getFullYear(),view.getMonth(),d),s=shiftFor(date),weekend=date.getDay()===5||date.getDay()===6,isToday=date.getTime()===today.getTime(),e=document.createElement('div');e.className='day'+(weekend?' weekend':'')+(isToday?' current':'');e.innerHTML='<div class="num">'+d+'</div>'+(isToday?'<span class="badge">TODAY</span>'+hamster():'')+'<div class="shift '+s[2]+'">'+s[0]+'<small>'+s[1]+'</small></div>';cal.appendChild(e)}}document.getElementById('prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar(day(new Date()))};document.getElementById('next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar(day(new Date()))};document.getElementById('todayBtn').onclick=()=>{view=new Date();view.setDate(1);render()};render();setInterval(()=>{let now=new Date();if(now.getHours()===0&&now.getMinutes()===0){view=new Date();view.setDate(1);render()}},30000);
</script></body></html>
